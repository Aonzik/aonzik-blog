<div class="ch-header"><p class="ch-title">复利的两面：翻倍有多慢，亏完回本有多难</p><p class="ch-lede">上图是 72 法则算出的翻倍年限，下图是亏损之后要涨多少才回本。两栏都用对数刻度——不然 360 年与 3.6 年、900% 与 11.1% 根本画不进同一张图。</p></div>
<div class="ch-grid-2">

<p class="ch-micro">收益率从 0.2% 提到 20%，翻了 100 倍；翻倍时间也只缩短 100 倍——这就是复利的斜率。</p></div>
