<div class="ch-header"><p class="ch-title">均线是怎么「交叉」的：价格、MA5 与 MA20</p><p class="ch-lede">均线没有任何预测魔力，它只是把过去 N 天收盘价做了个平均再连起来。短均线追得快、长均线反应慢，两条线交叉的位置，就是市场平均成本刚刚换了方向的时刻。</p></div>
